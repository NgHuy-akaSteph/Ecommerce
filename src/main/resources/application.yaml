server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ecommerce
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    url: /v3/api-docs
  api-docs:
    enabled: true
