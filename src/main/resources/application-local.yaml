
spring:
  Jackson:
    time-zone: Asia/Ho_Chi_Minh
  # PostgreSQL Database
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce?options=-c%20TimeZone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  # Hibernate — Flyway manages schema, Hibernate only validates
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT
app:
  jwt:
    signerKey: ${JWT_SIGNER_KEY}
    token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_SECONDS:86400}

# Cloudflare R2 (S3-compatible storage)
cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:https://your-account-id.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:your-access-key}
    secret-key: ${R2_SECRET_KEY:your-secret-key}
    bucket-public: ${R2_BUCKET_NAME_PUBLIC:ecommerce-public}
    bucket-private: ${R2_BUCKET_NAME_PRIVATE:ecommerce-private}
    public-url: ${R2_PUBLIC_URL:https://pub-xxx.r2.dev}